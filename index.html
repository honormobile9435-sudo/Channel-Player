<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#13151a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#e8eef3;--sf:#fff;--tx:#14212e;--mu:#5a6b7b;--ac:#0a6c8f;--on:#fff;--bd:#c9d4de;--rw:#d3dde7;--dk:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151a;--sf:#1c1f26;--tx:#e6e8ee;--mu:#9aa0ad;--ac:#f2b53d;--on:#1b1300;--bd:#343843;--rw:#454851;--dk:#13151a}}
:root[data-theme="dark"]{--bg:#13151a;--sf:#1c1f26;--tx:#e6e8ee;--mu:#9aa0ad;--ac:#f2b53d;--on:#1b1300;--bd:#343843;--rw:#454851;--dk:#13151a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
svg{display:block;fill:currentColor}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#wv{position:relative;flex:none;height:60px;background:var(--sf);border-bottom:2px solid var(--ac)}
#cv{width:100%;height:100%;display:block;touch-action:none}
#t1,#t2{position:absolute;top:3px;font-size:12px;font-weight:600;padding:0 6px;background:var(--sf);border-radius:6px;opacity:.92}
#t1{left:4px}#t2{right:4px}
#mid{flex:1;min-height:0;display:flex}
#lp{flex:none;width:208px;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--sf);overflow-y:auto}
#now{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;justify-content:space-between;align-items:center}
.tb{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:transparent;display:grid;place-items:center;padding:0}
.tb svg{width:18px;height:18px}
#pp{width:38px;height:38px;border:0;background:var(--ac);color:var(--on)}
#pp svg{width:22px;height:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.g2 button,#en,#clr{height:28px;border:1px solid var(--bd);background:transparent;border-radius:14px;font-size:12px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
#en{width:100%;appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;background:var(--bg)}
[aria-pressed="true"]{background:var(--ac)!important;color:var(--on)!important;border-color:var(--ac)!important}
.ar{display:flex;gap:6px;align-items:center}
#tt{flex:1;min-width:0;font-size:11px;color:var(--mu);white-space:nowrap;cursor:pointer}
#clr.arm{border-color:var(--ac);color:var(--ac)}
.ms{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:12px}
#mv{flex:1;min-width:0;accent-color:var(--ac)}
#ch{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:8px;align-items:stretch}
.c{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--rw);border-radius:14px;padding:6px 4px}
.c.on{outline:2px solid var(--ac)}
.c.emp .dv,.c.emp .pb,.c.emp .fd,.c.emp .pc{opacity:.35;pointer-events:none}
.dv{width:100%;height:26px;border:0;border-radius:13px;background:var(--dk);font-size:10px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{flex:none;margin-bottom:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--dk);display:grid;place-items:center;padding:0}
.pb svg{width:20px;height:20px}
.c.on .pb{background:var(--ac);color:var(--on)}
.mt{width:100%;height:26px;border:0;border-radius:13px;background:var(--dk);font-size:11px;padding:0 4px;white-space:nowrap}
.c.emp .mt{opacity:.35;pointer-events:none}
.fd{flex:1;min-height:50px;width:44px;position:relative;touch-action:none;display:flex;justify-content:center}
.fd::before{content:"";width:6px;height:100%;border-radius:3px;background:var(--dk)}
.fl{position:absolute;bottom:0;width:6px;border-radius:3px;background:var(--ac)}
.kn{position:absolute;left:50%;width:34px;height:16px;margin:0 0 -8px -17px;border-radius:6px;background:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pc{font-size:11px}
.ad{width:100%;border:0;background:var(--dk);border-radius:10px;padding:4px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.du{font-size:10px;color:var(--mu)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20}
.bx{background:var(--sf);border-radius:16px;padding:14px;width:min(380px,92vw);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.bx h3{margin:0;font-size:15px}
.ln{display:flex;align-items:center;gap:8px}
.lb{font-size:12px;color:var(--mu)}
.in{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.sb,.pl button{height:34px;padding:0 12px;border:1px solid var(--bd);background:transparent;border-radius:17px;font-size:13px}
.ln .sb{flex:1}
.pl{display:flex;flex-wrap:wrap;gap:6px}
.bx input[type=range]{flex:1;accent-color:var(--ac)}
#ts{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:18px;z-index:30;font-size:13px}
@media(orientation:portrait){
#mid{flex-direction:column}
#lp{width:auto;flex:none;overflow:visible;border-bottom:1px solid var(--bd)}
.g2{grid-template-columns:repeat(4,1fr)}
.tb{width:40px;height:40px}
#pp{width:46px;height:46px}
.c{width:86px}
}
#ins{border-color:var(--ac);color:var(--ac);height:28px;border:1px solid var(--ac);background:transparent;border-radius:14px;padding:0 10px;font-size:12px}
</style></head><body>
<div id="app">
 <header id="wv"><canvas id="cv"></canvas><span id="t1">0:00</span><span id="t2">-0:00</span></header>
 <div id="mid">
  <aside id="lp">
   <div id="now">Nothing playing</div>
   <div class="tr">
    <button id="pv" class="tb" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button id="rw" class="tb" aria-label="Rewind"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6 8.5 6V6l-8.5 6z"/></svg></button>
    <button id="pp" class="tb" aria-label="Play or pause all"></button>
    <button id="ff" class="tb" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
    <button id="nx" class="tb" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
   </div>
   <div class="g2"><button id="tm" aria-pressed="false">⏲ Timer</button><button id="mx" aria-pressed="false">🎚 Multiplay</button><button id="sh" aria-pressed="false">🔀 Shuffle</button><button id="eqb">📶 EQ</button></div>
   <select id="en" aria-label="When a song ends"><option value="0">⏹ Stop</option><option value="1">🔁 Repeat</option><option value="2">⏭ Continue</option></select>
   <div class="ar"><span id="tt" title="Played / total. Tap to reset played time">⏱ 0:00 / 0:00</span><button id="clr">Clear</button><button id="ins" hidden>Install</button></div>
   <div class="ms"><span>Master</span><input id="mv" type="range" min="0" max="1" step="0.01" value="1" aria-label="Master volume"><span id="mvp">100%</span></div>
  </aside>
  <section id="ch"></section>
 </div>
</div>
<input id="fi" type="file" accept="audio/*" multiple hidden>
<input id="fr" type="file" accept="audio/*" hidden>
<div id="md" hidden></div>
<div id="ts" hidden></div>
<script>
const $=s=>document.querySelector(s),A=new Map(),BUS=new Map();
const IL='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',IP='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const rnd=new Set();let ka=null,kaOn=false,kaLock=false;
let songs=[],cur=null,db=null,mode=2,multi=false,ctx=null,held=[],endAt=0,shuf=false,ep=0,bo=false,bl=8,mvol=1,SEL=null,wvS=null;
const lsv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
try{const g=k=>localStorage.getItem(k);if(g('csm')!==null)mode=+g('csm');if(mode===3){mode=2;shuf=true}multi=g('csx')==='1';if(g('css')==='1')shuf=true;ep=+g('cse')||0;bo=g('csb')==='1';if(g('csl')!==null)bl=+g('csl');if(g('csv')!==null)mvol=+g('csv')}catch(e){}
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('channel-soundboard',1);q.onupgradeneeded=()=>q.result.createObjectStore('s',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function tx(m,f){return new Promise(r=>{if(!db)return r(null);try{const t=db.transaction('s',m),q=f(t.objectStore('s'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>r(null)}catch(e){r(null)}})}
const fmt=s=>{s=isFinite(s)?Math.max(0,Math.floor(s)):0;const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+c:m+':'+c};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gv=a=>a._g?a._g.gain.value:(a._lv||0),sv=(a,v)=>{if(a._g)a._g.gain.value=v;else{a._lv=v;a.volume=Math.max(0,Math.min(1,v*mvol))}};
const nm=s=>(s.startAt||s.stopAt?'⏰ ':'')+s.name,save=s=>tx('readwrite',st=>st.put(s));
function so(){lsv('cso',JSON.stringify(songs.map(s=>s.id)))}
function toast(m){const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2600)}
function gctx(){return ctx=ctx||new(window.AudioContext||window.webkitAudioContext)()}
/* Audio buses: EQ + bass + master, one per output device */
const PRE=[['Flat',[0,0,0,0,0]],['Pop',[-1,2,4,2,-1]],['Rock',[4,2,-1,3,4]],['Jazz',[3,2,-2,2,4]],['Classical',[4,2,-2,2,3]],['Vocal',[-3,-1,4,3,0]],['Dance',[6,4,0,2,3]]];
function bus(id){
 id=id||'default';let b=BUS.get(id);if(b)return b;
 const c=gctx(),fs=[[60,'lowshelf'],[230,'peaking'],[910,'peaking'],[3600,'peaking'],[14000,'highshelf']].map(x=>{const f=c.createBiquadFilter();f.type=x[1];f.frequency.value=x[0];if(x[1]==='peaking')f.Q.value=1;return f});
 const bs=c.createBiquadFilter();bs.type='lowshelf';bs.frequency.value=100;
 const lm=c.createDynamicsCompressor();lm.threshold.value=-2;lm.knee.value=0;lm.ratio.value=20;lm.attack.value=.003;lm.release.value=.25;
 const inp=c.createGain(),mg=c.createGain();let n=inp;
 fs.concat([bs,lm,mg]).forEach(x=>{n.connect(x);n=x});
 b={inp:inp,fs:fs,bs:bs,mg:mg};
 if(id==='default')n.connect(c.destination);
 else{const m=c.createMediaStreamDestination(),el=new Audio();n.connect(m);el.srcObject=m.stream;try{el.setSinkId(id).catch(()=>{})}catch(e){}el.play().catch(()=>{});b.el=el}
 BUS.set(id,b);applyFx();return b;
}
function applyFx(){
 BUS.forEach(b=>{b.fs.forEach((f,i)=>{f.gain.value=PRE[ep][1][i]});b.bs.gain.value=bo?bl:0;b.mg.gain.value=mvol});
 A.forEach(a=>{if(!a._g&&a._lv!==undefined)a.volume=Math.max(0,Math.min(1,a._lv*mvol))});
 $('#mvp').textContent=Math.round(mvol*100)+'%';
}
function mk(s){
 let a=A.get(s.id);if(a)return a;
 a=new Audio();a.preload='auto';a.src=URL.createObjectURL(s.blob);a._s=s;a._f=0;a._out=false;
 if(s.dev){try{a._sk=a.setSinkId(s.dev).catch(()=>toast('Device for "'+s.name+'" is not available, using default output'))}catch(e){}}
 else try{const c=gctx(),n=c.createMediaElementSource(a),g=c.createGain();g.gain.value=0;n.connect(g);g.connect(bus().inp);a._g=g}catch(e){}
 a.addEventListener('ended',()=>ended(a));a.addEventListener('play',ui);a.addEventListener('pause',ui);
 a.addEventListener('timeupdate',()=>{const t=a.currentTime,d=t-(a._lt||0);a._lt=t;if(d>0&&d<1.5&&!a.paused)s._pl=Math.min(s.dur||1e9,(s._pl||0)+d);if(cur&&cur.id===s.id)tu();total();sweep()});
 A.set(s.id,a);return a;
}
function fade(a,tg,D,done){
 const my=++a._f,from=gv(a),t0=performance.now();
 (function f(){
  if(a._f!==my)return;
  const p=Math.min(1,(performance.now()-t0)/D);
  sv(a,from+(tg()-from)*p);
  if(p<1)setTimeout(f,40);else if(done)done();
 })();
}
const ev=s=>s.mute?0:s.vol;
function start(s){
 rnd.add(s.id);
 const a=mk(s);if(ctx&&ctx.state!=='running')ctx.resume();
 a._out=false;if(a.paused)sv(a,0);
 (a._sk||Promise.resolve()).then(()=>a.play()).catch(()=>{});fade(a,()=>ev(s),1200,null);cur=s;ui();
}
function out(a,D,cb){a._out=true;fade(a,()=>0,D||1200,()=>{a.pause();a._out=false;if(cb)cb()})}
function halt(a){a._f++;a._out=false;a.pause()}
function live(a){return !a.paused&&!a._out}
function al(){let x=false;A.forEach(a=>{if(live(a))x=true});return x}
function play(s){
 const a=mk(s);
 if(live(a)){halt(a);ui();return}
 if(!multi)A.forEach(o=>{if(o!==a&&live(o))out(o)});
 start(s);
}
function ended(a){
 const s=a._s;a._out=false;
 if(mode===0){ui();return}
 if(mode===1){a.currentTime=0;a.play().catch(()=>{});return}
 nextAfter(s);
}
function nextAfter(s){
 if(!songs.length)return;
 const i=songs.findIndex(x=>x.id===s.id);let j;
 if(shuf){
  const L=songs.filter(x=>!rnd.has(x.id)&&x.id!==s.id);
  if(!L.length){rnd.clear();ui();return}
  j=songs.indexOf(L[Math.floor(Math.random()*L.length)]);
 }else{j=i+1;if(j>=songs.length){ui();return}}
 const n=mk(songs[j]);
 if(live(n)){ui();return}
 n.currentTime=0;start(songs[j]);
}
function go(dir){
 if(!songs.length)return;
 const ca=cur&&A.get(cur.id),i=cur?songs.findIndex(x=>x.id===cur.id):-1;
 if(dir<0&&ca&&ca.currentTime>3){ca.currentTime=0;return}
 let j;
 if(dir>0&&shuf&&songs.length>1){j=i;while(j===i)j=Math.floor(Math.random()*songs.length)}
 else j=i<0?0:(i+dir+songs.length)%songs.length;
 const s=songs[j];
 if(!multi)A.forEach(o=>{if(live(o)&&o._s!==s)out(o)});
 else if(ca&&live(ca)&&s!==cur)out(ca);
 const t=A.get(s.id);if(t)t.currentTime=0;
 start(s);
}
/* Waveform */
async function peaks(s){
 if(s._pk!==undefined)return s._pk;
 s._pk=null;
 try{
  if(s.blob.size>30e6)return null;
  const buf=await gctx().decodeAudioData(await s.blob.arrayBuffer()),d=buf.getChannelData(0),N=320,k=Math.max(1,Math.floor(d.length/N)),st=Math.max(1,k>>6),p=[];
  for(let i=0;i<N;i++){let m=0;for(let j=i*k;j<(i+1)*k&&j<d.length;j+=st){const v=Math.abs(d[j]);if(v>m)m=v}p.push(m)}
  const mx=Math.max.apply(null,p)||1;s._pk=p.map(v=>v/mx);
 }catch(e){}
 return s._pk;
}
function draw(){
 const c=$('#cv'),w=c.clientWidth,h=c.clientHeight,r=window.devicePixelRatio||1;
 if(!w||!h)return;
 if(c.width!==Math.round(w*r)||c.height!==Math.round(h*r)){c.width=Math.round(w*r);c.height=Math.round(h*r)}
 const x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,h);
 const a=cur&&A.get(cur.id),d=a&&a.duration,f=d?a.currentTime/d:0,p=cur&&cur._pk,cs=getComputedStyle(document.documentElement),ac=cs.getPropertyValue('--ac').trim(),mu=cs.getPropertyValue('--bd').trim(),N=p?p.length:0;
 if(N){const bw=w/N;for(let i=0;i<N;i++){const bh=Math.max(2,p[i]*h*.8);x.fillStyle=i/N<f?ac:mu;x.fillRect(i*bw,(h-bh)/2,Math.max(1,bw-1),bh)}}
 else{x.fillStyle=mu;x.fillRect(0,h/2-1,w,2);x.fillStyle=ac;x.fillRect(0,h/2-1,w*f,2)}
 x.fillStyle=ac;x.fillRect(Math.max(0,f*w-1),0,2,h);
}
const cv=$('#cv');let sd=false;
const sx=e=>{const a=cur&&A.get(cur.id);if(a&&a.duration){const r=cv.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;tu()}};
cv.onpointerdown=e=>{sd=true;cv.setPointerCapture(e.pointerId);sx(e)};
cv.onpointermove=e=>{if(sd)sx(e)};
cv.onpointerup=cv.onpointercancel=()=>{sd=false};
addEventListener('resize',draw);
function tu(){
 const a=cur&&A.get(cur.id),d=a&&a.duration,t=a?a.currentTime:0;
 $('#t1').textContent=fmt(t);$('#t2').textContent='-'+fmt(d?d-t:0);draw();
 try{if(a&&d&&isFinite(d))navigator.mediaSession.setPositionState({duration:d,position:Math.min(t,d),playbackRate:1})}catch(e){}
}
function msu(){
 if(!('mediaSession' in navigator))return;
 try{const m=navigator.mediaSession;if(kaOn&&!al()){m.metadata=new MediaMetadata({title:'Waiting for scheduled start',artist:'Channel Soundboard'});m.playbackState='playing';return}m.metadata=cur?new MediaMetadata({title:cur.name,artist:'Channel Soundboard'}):null;m.playbackState=al()?'playing':'paused'}catch(e){}
}
if('mediaSession' in navigator){
 const m=navigator.mediaSession,h=(n,f)=>{try{m.setActionHandler(n,f)}catch(e){}};
 h('play',()=>{if(!al())$('#pp').click()});h('pause',()=>{if(al())$('#pp').click()});
 h('previoustrack',()=>go(-1));h('nexttrack',()=>go(1));
 h('seekbackward',()=>seekBy(-10));h('seekforward',()=>seekBy(10));
 h('seekto',d=>{const a=cur&&A.get(cur.id);if(a&&isFinite(d.seekTime))a.currentTime=d.seekTime});
}
/* Channels */
function paint(c,s){const v=s?s.vol:1;c.querySelector('.fl').style.height=v*100+'%';c.querySelector('.kn').style.bottom=v*100+'%';c.querySelector('.pc').textContent=Math.round(v*100)+'%'}
function fader(c,s){
 const f=c.querySelector('.fd');let on=false;
 const set=e=>{const r=f.getBoundingClientRect();s.vol=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));paint(c,s);const a=A.get(s.id);if(a&&live(a))sv(a,ev(s))};
 f.onpointerdown=e=>{on=true;f.setPointerCapture(e.pointerId);set(e)};
 f.onpointermove=e=>{if(on)set(e)};
 f.onpointerup=f.onpointercancel=()=>{if(on){on=false;save(s)}};
}
function mtp(c,s){const b=c.querySelector('.mt');b.textContent=s&&s.mute?'🔇 Muted':'🔊 Mute';b.setAttribute('aria-pressed',!!(s&&s.mute))}
function strip(s){
 const c=document.createElement('div');c.className='c'+(s?'':' emp');
 c.innerHTML='<button class="dv"></button><button class="mt" aria-label="Mute this channel"></button><button class="pb">'+IL+'</button><div class="fd"><div class="fl"></div><div class="kn"></div></div><span class="pc"></span><button class="ad"><span class="nm"></span><span class="du"></span></button>';
 c.querySelector('.dv').textContent='🔈 '+(s&&s.devn?s.devn:'Default');
 if(s){c.dataset.id=s.id;c.querySelector('.nm').textContent=nm(s);c.querySelector('.du').textContent=s.dur?fmt(s.dur):'--:--';fader(c,s)}
 else c.querySelector('.nm').textContent='+ Add song';
